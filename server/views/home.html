{% extends "./newindex.html" %}
{% block container %}
<div class="row column text-center">
    <h2 style="color:#898989">最新議題</h2>
</div>
<div class="row small-up-1 medium-up-2 large-up-3 xlarge-up-4" data-toggler data-animate="slide-in-down slide-out-up">


    {% asyncEach issue in issues %}
        <div class="column text-center">
                    <div style="-webkit-box-shadow: 0px 0px 10px 1px rgba(171,171,171,0.39);
            -moz-box-shadow: 0px 0px 10px 1px rgba(171,171,171,0.39);
            box-shadow: 0px 0px 10px 1px rgba(171,171,171,0.39);border:1px solid #ddd;border-radius:4px;margin-bottom:10px">
                <img class="thumbnail" src="{{ issue.thumbnail }}">
                <h6>{{ issue.title }}</h6>
                <div class="stats" style="clear:both">
                    <div class="users" style="font-size:14px;color:#c3c3c3">
                        <i class="fa fa-pie-chart"></i>
                        已有
                        <strong style="color:red;font-size:20px;font-family:'Helvetica Neue', Arial, 'Heiti TC', 'LiHei Pro', 微軟正黑體, 'Microsoft Jhenghei', sans-serif;">&nbsp{{ issue.counter }}&nbsp</strong>用戶 投過票
                    </div>
                </div>
                <a href="/issues/{{ issue.sn }}" class="button bold">VOTE NOW!</a>
            </div>
        </div>
    {% endeach %}
</div>
{% endblock %}
