{% for issue in issues %}
    <div class="column text-center">
        <div class="issue_area">
            <a href="/issues/{{ issue.sn }}">
                <div class="thumbnail" style="background-image:url({{ issue.thumbnail }});"></div>
            </a>
            <h3>{{ issue.title }}</h3>
            <div class="stats">
                {% if issue.continued %}
                    <div class="votetime">
                       <i class="fa fa-calendar"></i>
                       <span>此為長期投票</span>
                    </div>
                {% else %}
                    <div class="votetime">
                       <i class="fa fa-calendar"></i> {{ issue.startTime }} ~ {{ issue.endTime }}
                    </div>
                {% endif %}
                <div class="users">
                    <i class="fa fa-pie-chart"></i>
                    已有
                    <span class="num-count">{{ issue.counter }}</span>用戶 投過票
                </div>
            </div>

            {% if issue.isVoted == true %}
                <a href="/issues/{{ issue.sn }}" class="button bold is-voted"><i class="fa-fw fa fa-hand-pointer-o"></i>您已經投過票！</a>
            {% else %}
               <a href="/issues/{{ issue.sn }}" class="button bold"><i class="fa-fw fa fa-hand-pointer-o"></i>VOTE NOW!</a>
            {% endif %}
        </div>
    </div>
{% endfor %}
