<div class="sidebar">
    <ul class="vertical dropdown menu">
        <li>
            <a id="mobile-logo" href="/">
                <img src="/static/images/logo.png" />NOWVOTE
            </a>
        </li>
        {% for category in categories %}
            <li class="left_item{{ loop.index }}">
                <a class="hollow" href="{{ category.url }}">
                    <i class="fa fa-star"></i>{{ category.title }}</a>
            </li>
        {% endfor %}
        <div class="sidebar-separator"></div>
        {# 從 middlewares auth 裡面的 res.locals.user 取得 #}
        {% if user %}
            <li class="title title-custom">會員專區</li>
            <li>
                <a href="/user/me"><i class="fa fa-user fa-fw"></i>我的帳戶</a>
            </li>
            <li>
                <a class="user-receipt" href="#"><i class="fa fa-wpforms fa-fw"></i>建議議題</a>
            </li>
            <li>
                <a class="button" href="/auth/logout"><i class="fa-fw fa fa-sign-out"></i>登出</a>
            </li>
        {% else %}
            <li>
                <a class="button" href="#login-modal"><i class="fa-fw fa fa-sign-in"></i>登入</a>
            </li>
        {% endif %}
    </ul>
</div>
