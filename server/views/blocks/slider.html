
    <div class="orbit" role="region" aria-label="Favorite Space Pictures" data-orbit style="margin-top:-75px">
        <ul class="orbit-container" style="height:450px">
            <button class="orbit-previous" aria-label="previous"><span class="show-for-sr">Previous Slide</span>&#9664;</button>
            <button class="orbit-next" aria-label="next"><span class="show-for-sr">Next Slide</span>&#9654;</button>

            {# 第一種做法 #}
            {% for banner in sliderBanner %}
                {% if loop.first %}
                    <li class="orbit-slide is-active">
                {% else %}
                    <li class="orbit-slide">
                {% endif %}
                     <img src="{{banner.image}}">
                </li>
            {% endfor %}

            {# 第二種做法 #}
            {% for banner in sliderBanner %}
                {% set active = '' %}
                {% if loop.first %}
                    {% set active = 'is-active' %}
                {% else %}

                {% endif %}

                <li class="orbit-slide {{active}}">
                     <img src="{{banner.image}}">
                </li>
            {% endfor %}
        </ul>
    </div>
