<div class="off-canvas-wrapper-inner" data-off-canvas-wrapper>

    <div class="off-canvas position-left" id="offCanvas" data-off-canvas>
        Off Canvas Content
    </div>

    <div class="off-canvas-content" data-off-canvas-content>
        <button type="button" class="button hide-for-medium" data-toggle="offCanvas">Open Menu</button>
        <header class="header">
            <div class="header-sticky-container" data-sticky-container>
                <div class="title-bar" data-sticky data-options="marginTop:0;">
                    <div class="title-bar-left">
                        <a id="logo" href="/">
                            <img src="http://placehold.it/150x70"/>
                        </a>
                        <ul class="dropdown menu float-left" data-dropdown-menu>
                            {% for category in categories %}
                                {% if loop.first %}
                                    <li class="has-submenu">
                                        <a class="hollow button" href="{{ category.url }}">{{ category.title }}</a>
                                        <ul class="menu submenu vertical" data-submenu>
                                            <li>
                                                <a href="/page/1.html">文字測試頁</a>
                                            </li>
                                            <li>
                                                <a href="/page/2.html">直方測試頁</a>
                                            </li>
                                            <li>
                                                <a href="/page/3.html">圓餅測試頁</a>
                                            </li>
                                        </ul>
                                    </li>
                                {% else %}
                                    <li>
                                        <a class="button" href="{{ category.url }}">{{ category.title }}</a>
                                    </li>
                                {% endif %}
                            {% endfor %}
                        </ul>
                    </div>
                    <div class="title-bar-right">
                        <ul class="menu">
                            <li>
                                <a href="#">我的帳戶</a>
                            </li>
                            <li>
                                <a class="button">登入</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>
    </div>
</div>
