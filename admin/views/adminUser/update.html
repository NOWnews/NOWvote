{% extends "../index.html" %}

{# 設定變數 #}
{% set pageTitle = "修改管理者" %}
{% set pageRoute = "/adminUser" %}

{% block breadcrumbs %}
    <li>{{ pageTitle }}</li>
{% endblock %}

{% block container %}
    <form method="post" action="{{ pageRoute }}/{{ adminUser.sn }}">
        <input type="hidden" name="_method" value="patch"/>
        <h3>{{ pageTitle }}</h3>
        <div class="row">
            <div class="large-12 columns">
                <label>編號
                    <input type="text" value="{{adminUser.sn}}" disabled/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>姓名
                    <input name="name" type="text" value="{{adminUser.name}}" placeholder="請輸入姓名" required/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>E-mail
                    <input type="text" value="{{adminUser.email}}" disabled/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>權限
                    <select name="policy">
                        <option value="{{adminUser.policy}}">{{adminUser.policy}}</option>
                    </select>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>建立者
                    <input type="text" value="{{adminUser.createdBy.name}}" disabled/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>更新者
                    <input type="text" value="{{adminUser.updatedBy.name}}" disabled/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>新增時間
                    <input type="text" value="{{adminUser.formatCreatedAt}}" disabled/>
                </label>
            </div>
        </div>
        <div class="row">
            <div class="large-12 columns">
                <label>更新時間
                    <input type="text" value="{{adminUser.formatUpdatedAt}}" disabled/>
                </label>
            </div>
        </div>
        <div class="text-right btn-box">
            <input type="submit" value="儲存" class="button success"/>
        </div>
    </form>
{% endblock %}
