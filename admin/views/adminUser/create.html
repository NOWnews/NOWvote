{% extends "../index.html" %}

{# 設定變數 #}
{% set pageTitle = "新增管理者" %}
{% set pageRoute = "/adminUser" %}

{% block breadcrumbs %}
    <li>{{ pageTitle }}</li>
{% endblock %}

{% block container %}
    <article>
        <form method="post" action="{{ pageRoute }}">
            <h3>{{ pageTitle }}</h3>
            <div class="row">
                <div class="large-12 colums">
                    <label>
                        姓名
                        <input name="name" type="text" placeholder="請輸入姓名" required></input>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="large-12 colums">
                    <label>
                        E-mail
                        <input name="email" type="email" placeholder="請輸入 email" required></input>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="large-12 colums">
                    <label>
                        密碼
                        <input name="password" type="password" placeholder="請輸入密碼" required></input>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="large-12 colums">
                    <label>
                        再次確認密碼
                        <input name="confirm" type="password" placeholder="再次確認密碼" required></input>
                    </label>
                </div>
            </div>
            <div class="text-right btn-box">
                <input type="submit" value="儲存" class="button success"/>
                <a href="{{ pageRoute }}" class="button secondary">取消</a>
            </div>
        </form>
    </article>
{% endblock %}
