{% extends "../index.html" %}

{% block breadcrumbs %}
    <li>管理者</li>
{% endblock %}

{% block container %}
    {% asyncEach adminUser in adminUsers %}
      <div>
          <span>{{ adminUser.sn }}</span>
          <span>{{ adminUser.name }}</span>
          <span>{{ adminUser.email }}</span>
      </div>
    {% endeach %}
{% endblock %}
